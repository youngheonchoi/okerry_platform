spring.application.name=okerry_platform
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
platform.oauth2.issuer=${OAUTH2_ISSUER_URI:http://localhost:8080}
platform.oauth2.keys.public-key=${OAUTH2_RSA_PUBLIC_KEY:}
platform.oauth2.keys.private-key=${OAUTH2_RSA_PRIVATE_KEY:}
platform.oauth2.keys.key-id=${OAUTH2_RSA_KEY_ID:okerry-platform}
