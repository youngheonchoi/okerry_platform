<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: document(title='okerry platform 회원가입', content=~{::main})}">
<main class="platform-auth-page okerry-container">
    <section class="platform-auth-card-wrap" aria-labelledby="signup-title">
        <div class="okerry-card">
            <header class="okerry-card-header okerry-stack">
                <h1 class="okerry-title-2xl" id="signup-title">회원가입</h1>
            </header>

            <form class="okerry-card-body okerry-stack"
                  th:action="@{/signup}"
                  th:object="${signupRequest}"
                  method="post">
                <div class="okerry-alert okerry-alert-danger"
                     role="alert"
                     th:if="${#fields.hasGlobalErrors()}"
                     th:each="error : ${#fields.globalErrors()}"
                     th:text="${error}">
                    회원가입을 처리할 수 없습니다.
                </div>

                <div class="okerry-field">
                    <label class="okerry-label" for="name">이름</label>
                    <input class="okerry-input"
                           id="name"
                           th:field="*{name}"
                           type="text"
                           autocomplete="name"
                           required>
                    <p class="okerry-error-text"
                       th:if="${#fields.hasErrors('name')}"
                       th:errors="*{name}">이름 입력 오류</p>
                </div>

                <div class="okerry-field">
                    <label class="okerry-label" for="email">이메일</label>
                    <div class="platform-inline-action">
                        <input class="okerry-input"
                               id="email"
                               th:field="*{email}"
                               type="email"
                               autocomplete="username"
                               placeholder="name@example.com"
                               required>
                        <button class="okerry-btn okerry-btn-secondary"
                                id="email-verification-trigger"
                                type="button"
                                aria-controls="email-verification-panel"
                                aria-expanded="false">
                            인증
                        </button>
                    </div>
                    <p class="okerry-error-text"
                       th:if="${#fields.hasErrors('email')}"
                       th:errors="*{email}">이메일 입력 오류</p>
                </div>

                <div class="okerry-field"
                     id="email-verification-panel"
                     data-email-verification-panel
                     hidden>
                    <label class="okerry-label" for="verification-code">인증번호</label>
                    <div class="platform-inline-action">
                        <input class="okerry-input"
                               id="verification-code"
                               name="verificationCode"
                               type="text"
                               inputmode="numeric"
                               autocomplete="one-time-code"
                               placeholder="인증번호를 입력하세요">
                        <button class="okerry-btn okerry-btn-primary"
                                id="email-verification-confirm"
                                type="button">
                            확인
                        </button>
                    </div>
                    <p class="okerry-help-text"
                       id="email-verification-status"
                       aria-live="polite">인증 버튼을 누른 뒤 받은 인증번호를 입력하세요.</p>
                </div>

                <div class="okerry-field">
                    <label class="okerry-label" for="password">비밀번호</label>
                    <input class="okerry-input"
                           id="password"
                           th:field="*{password}"
                           type="password"
                           autocomplete="new-password"
                           required>
                    <p class="okerry-error-text"
                       th:if="${#fields.hasErrors('password')}"
                       th:errors="*{password}">비밀번호 입력 오류</p>
                </div>

                <div class="okerry-field">
                    <label class="okerry-label" for="password-confirmation">비밀번호 확인</label>
                    <input class="okerry-input"
                           id="password-confirmation"
                           th:field="*{passwordConfirmation}"
                           type="password"
                           autocomplete="new-password"
                           required>
                    <p class="okerry-error-text"
                       th:if="${#fields.hasErrors('passwordConfirmation')}"
                       th:errors="*{passwordConfirmation}">비밀번호 확인 입력 오류</p>
                    <p class="okerry-error-text"
                       th:if="${#fields.hasErrors('passwordConfirmed')}"
                       th:errors="*{passwordConfirmed}">비밀번호 확인 오류</p>
                </div>

                <div class="platform-auth-action">
                    <button class="okerry-btn okerry-btn-primary" type="submit">회원가입</button>
                </div>
            </form>

            <footer class="okerry-card-footer okerry-center">
                <span class="okerry-text-muted">이미 계정이 있으신가요?</span>
                <a th:href="@{/login}">로그인</a>
            </footer>
        </div>
    </section>
    <script defer th:src="@{/js/platform_signup.js}"></script>
</main>
</html>
